backend:
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  port: 3000
  adminPort: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env: {}
  envSecrets: {}
  livenessProbe: {}
  readinessProbe: {}
  persistence:
    enabled: false
    volumes: []
    # - name: data
    #   mountPath: /app/data
    #   size: 1Gi
    #   storageClass: ""
    #   accessModes:
    #     - ReadWriteOnce

frontend:
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  env: {}
  envSecrets: {}
  livenessProbe: {}
  readinessProbe: {}

adminFrontend:
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  env: {}
  envSecrets: {}
  livenessProbe: {}
  readinessProbe: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  adminHost: ""
  tls: []
  backendPaths:
    - path: /api
      pathType: Prefix
    - path: /ws
      pathType: Prefix
  adminBackendPaths:
    - path: /admin
      pathType: Prefix

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
